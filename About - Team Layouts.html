<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bankers Edge — Team Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#15315f;
    --navy-deep:#0f2549;
    --blue:#1e57b8;
    --ink:#26303f;
    --muted:#5d6878;
    --panel:#eef2f8;
    --line:#dde4ee;
    --font-head:'Poppins',system-ui,sans-serif;
    --font-body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--ink);}

  /* ===== Team section (shared) ===== */
  .tm-section{
    width:100%;
    background:#fff;
    padding:64px 56px 60px;
    font-family:var(--font-body);
  }
  .tm-head{text-align:center;max-width:760px;margin:0 auto 52px;}
  .tm-eyebrow{
    display:inline-block;
    font-family:var(--font-head);
    font-weight:600;
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:14px;
  }
  .tm-title{
    font-family:var(--font-head);
    font-weight:700;
    font-size:42px;
    line-height:1.08;
    color:var(--navy);
    margin:0 0 14px;
    letter-spacing:-.01em;
  }
  .tm-sub{
    font-size:17px;
    line-height:1.6;
    color:var(--muted);
    margin:0;
  }

  .tm-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:36px;
    max-width:1320px;
    margin:0 auto;
  }
  .tm-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .tm-photo-wrap{
    width:172px;height:172px;
    border-radius:50%;
    padding:6px;
    background:#fff;
    box-shadow:0 0 0 2px var(--line), 0 14px 30px -12px rgba(15,37,73,.35);
    margin-bottom:22px;
  }
  .tm-photo{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  .tm-name{
    font-family:var(--font-head);
    font-weight:600;
    font-size:21px;
    color:var(--navy);
    margin:0 0 4px;
    line-height:1.2;
  }
  .tm-creds{font-weight:500;color:var(--navy);font-size:16px;}
  .tm-role{
    font-family:var(--font-head);
    font-weight:500;
    font-size:13.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--blue);
    margin:0 0 16px;
  }
  .tm-icons{display:flex;gap:10px;margin-bottom:20px;}
  .tm-ic{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:1.5px solid var(--line);
    color:var(--navy);
    background:#fff;
    text-decoration:none;
    transition:background .18s,color .18s,border-color .18s,transform .18s;
  }
  .tm-ic:hover{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
    transform:translateY(-2px);
  }
  .tm-bio{
    font-size:14.5px;
    line-height:1.65;
    color:var(--muted);
    margin:0;
    text-wrap:pretty;
  }
  .tm-btn{
    margin-top:auto;
    display:inline-block;
    font-family:var(--font-head);
    font-weight:600;
    font-size:13.5px;
    letter-spacing:.02em;
    color:var(--navy);
    text-decoration:none;
    padding:11px 26px;
    border:1.5px solid var(--navy);
    border-radius:999px;
    transition:background .18s,color .18s;
  }
  .tm-btn:hover{background:var(--navy);color:#fff;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="team-layouts.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  function App(){
    return (
      <DesignCanvas>
        <DCSection id="team" title="About — Team Section" subtitle="Layout explorations">
          <DCArtboard id="layout-1" label="Layout 1 · Circles in a row" width={1440} height={820}>
            <TeamLayout1 />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
